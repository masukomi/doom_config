change-type:
  destination: title
  type: select
  instructions: What kind of change?
  before-string: "["
  after-string: "] "
  options:
  - fix
  - add
  - change
  - refactor
  - clean-up
  modifiable: true
commit-title:
  destination: title
  type: text
  placeholder: Commit Title
commit-description:
  destination: body
  type: multiline-text
  instructions: Please describe your changes.
  allow-empty: true
code-sections:
  destination: body
  type: multi-select
  instructions: Which section(s) of the codebase?
  before-string: "\n\nCode Sections: "
  allow-empty: true
  options:
  - ui
  - ux
  - writing
  - packages
  - org-mode
  modifiable: true
  record-as: joined-string
